name: Skin bug report
description: Report a visual, animation, import, or compatibility issue.
body:
  - type: input
    id: version
    attributes:
      label: Champion and skin version
      placeholder: Talon 2.4.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: League patch and mod manager version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include base skin selection and other enabled mods.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Attach a screenshot or clip where possible. State whether this was observed in-game.
    validations:
      required: true
